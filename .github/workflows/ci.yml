name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  validar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descargar AutoHotkey v2
        shell: pwsh
        run: |
          $rel = Invoke-RestMethod 'https://api.github.com/repos/AutoHotkey/AutoHotkey/releases/latest'
          $asset = $rel.assets | Where-Object name -match '^AutoHotkey_.*\.zip$' | Select-Object -First 1
          Write-Host "Asset: $($asset.name)"
          Invoke-WebRequest $asset.browser_download_url -OutFile ahk.zip
          Expand-Archive ahk.zip -DestinationPath ahk
          $exe = Get-ChildItem ahk -Recurse -Filter AutoHotkey64.exe | Select-Object -First 1
          if (-not $exe) {
            Write-Host 'No se encontro AutoHotkey64.exe dentro del zip:'
            Get-ChildItem ahk -Recurse | ForEach-Object { Write-Host $_.FullName }
            exit 1
          }
          "AHK_EXE=$($exe.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "AHK: $($exe.FullName)"

      # AutoHotkey64.exe es una app GUI: pwsh no la espera ni setea
      # $LASTEXITCODE — hay que usar Start-Process -Wait -PassThru
      - name: Validar sintaxis de midword.ahk
        shell: pwsh
        run: |
          $p = Start-Process $env:AHK_EXE -ArgumentList '/ErrorStdOut','/validate','midword.ahk' -Wait -PassThru -NoNewWindow -RedirectStandardOutput val.out -RedirectStandardError val.err
          Get-Content val.out, val.err -ErrorAction SilentlyContinue | Write-Host
          if ($p.ExitCode -ne 0) { Write-Host "FALLO VALIDACION (exit=$($p.ExitCode))"; exit 1 }
          Write-Host 'VALIDACION OK'

      - name: Selftest del parser
        shell: pwsh
        run: |
          $p = Start-Process $env:AHK_EXE -ArgumentList '/ErrorStdOut','midword.ahk','--selftest' -Wait -PassThru -NoNewWindow -RedirectStandardOutput st.out -RedirectStandardError st.err
          Get-Content st.out, st.err -ErrorAction SilentlyContinue | Write-Host
          if ($p.ExitCode -ne 0) { Write-Host "FALLO SELFTEST (exit=$($p.ExitCode))"; exit 1 }

  release:
    # al pushear un tag v* compila el exe y lo adjunta al Release con su hash
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validar
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Descargar AutoHotkey v2 y Ahk2Exe
        shell: pwsh
        run: |
          $rel = Invoke-RestMethod 'https://api.github.com/repos/AutoHotkey/AutoHotkey/releases/latest'
          $asset = $rel.assets | Where-Object name -match '^AutoHotkey_.*\.zip$' | Select-Object -First 1
          Invoke-WebRequest $asset.browser_download_url -OutFile ahk.zip
          Expand-Archive ahk.zip -DestinationPath ahk
          $exe = Get-ChildItem ahk -Recurse -Filter AutoHotkey64.exe | Select-Object -First 1
          if (-not $exe) { Write-Host 'Sin AutoHotkey64.exe'; exit 1 }
          "AHK_EXE=$($exe.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

          $rel2 = Invoke-RestMethod 'https://api.github.com/repos/AutoHotkey/Ahk2Exe/releases/latest'
          $asset2 = $rel2.assets | Where-Object name -match '\.zip$' | Select-Object -First 1
          Invoke-WebRequest $asset2.browser_download_url -OutFile ahk2exe.zip
          Expand-Archive ahk2exe.zip -DestinationPath ahk2exe
          $a2e = Get-ChildItem ahk2exe -Recurse -Filter Ahk2Exe.exe | Select-Object -First 1
          if (-not $a2e) { Write-Host 'Sin Ahk2Exe.exe'; exit 1 }
          "A2E_EXE=$($a2e.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Compilar Midword.exe
        shell: pwsh
        run: |
          $p = Start-Process $env:A2E_EXE -ArgumentList "/in","midword.ahk","/out","Midword.exe","/base","$env:AHK_EXE","/icon","midword.ico","/silent","verbose" -Wait -PassThru
          $deadline = (Get-Date).AddSeconds(60)
          while (-not (Test-Path Midword.exe) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 500 }
          if (-not (Test-Path Midword.exe)) { Write-Host "FALLO COMPILACION (exit=$($p.ExitCode))"; exit 1 }

      - name: Calcular hash SHA-256
        shell: pwsh
        run: |
          $h = (Get-FileHash Midword.exe -Algorithm SHA256).Hash
          "SHA-256 de Midword.exe:`n$h" | Out-File SHA256.txt -Encoding utf8
          Write-Host $h

      - name: Adjuntar al Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Midword.exe
            SHA256.txt
